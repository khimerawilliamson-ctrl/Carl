<!DOCTYPE html>
<html lang="en">
<head>

      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    #chatbox {
      width: 90%;
      max-width: 600px;

    }

    #messageInput {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #222;
      color: white;
    }

    #sendBtn {
      padding: 10px 20px;
      margin-left: 10px;
      background: #444;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #sendBtn:hover {
      background: #666;
    }
  </style>
</head>
